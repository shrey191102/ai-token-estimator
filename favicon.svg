<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Glowing Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <!-- Neon Token Circuit Gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Accent Cyan Glow -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Square Icon -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="12" />

  <!-- Glowing Microchip Body -->
  <rect x="146" y="146" width="220" height="220" rx="44" fill="url(#chipGrad)" />

  <!-- Chip Pins / Connectors -->
  <!-- Top & Bottom Pins -->
  <path d="M 196 100 V 146 M 256 100 V 146 M 316 100 V 146" stroke="#4f46e5" stroke-width="16" stroke-linecap="round" />
  <path d="M 196 366 V 412 M 256 366 V 412 M 316 366 V 412" stroke="#4f46e5" stroke-width="16" stroke-linecap="round" />
  <!-- Left & Right Pins -->
  <path d="M 100 196 H 146 M 100 256 H 146 M 100 316 H 146" stroke="#4f46e5" stroke-width="16" stroke-linecap="round" />
  <path d="M 366 196 H 412 M 366 256 H 412 M 366 316 H 412" stroke="#4f46e5" stroke-width="16" stroke-linecap="round" />

  <!-- Inner Token Grid / Matrix Icon -->
  <rect x="196" y="196" width="48" height="48" rx="12" fill="#ffffff" />
  <rect x="268" y="196" width="48" height="48" rx="12" fill="url(#glowGrad)" />
  <rect x="196" y="268" width="48" height="48" rx="12" fill="url(#glowGrad)" />
  <rect x="268" y="268" width="48" height="48" rx="12" fill="#ffffff" />
</svg>
